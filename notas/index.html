<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <style>
        /* Tema inline para evitar flash branco */
        :root {
            --bg-inline: #f0f2f0;
            --text-inline: #1a2a21;
        }

        [data-theme="dark"] {
            --bg-inline: black;
            --text-inline: #f0f2f0;
        }

        html {
            background-color: var(--bg-inline);
        }

        body {
            background-color: var(--bg-inline);
            color: var(--text-inline);
        }

        body::before {
            display: none;
        }
    </style>
    <script>
        (function () {
            const tema = localStorage.getItem('tema');
            if (tema === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.body.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas | Mpindi TecMed</title>
    <link rel="stylesheet" href="../assets/css/remixicon.css">
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================================================== -->
    <!-- NAVEGAÇÃO SUPERIOR -->
    <!-- ================================================================== -->
    <nav class="nav-topo">
        <span class="nav-logo">Bloco de Notas</span>
        <button class="btn-hamburger" id="btnHamburger" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <!-- ================================================================== -->
    <!-- MENU OVERLAY -->
    <!-- ================================================================== -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- ================================================================== -->
    <!-- MENU LATERAL -->
    <!-- ================================================================== -->
    <div class="menu-lateral" id="menuLateral">
        <div class="menu-header">
            <div class="menu-header-icon">
                <img src="../assets/imagens/logo.png" alt="Logo da MatClínica">
            </div>
            <h3><span class="matClinica">Mat</span>Clínica</h3>
            <p>Suporte de Decisão Clínica</p>
        </div>
        <div class="menu-items">
            <a href="../index.html" class="menu-item" data-page="inicio">
                <div class="menu-item-icon"><i class="ri-home-line"></i></div>
                <span>Ferramentas</span>
                <i class="ri-arrow-right-s-line menu-item-arrow"></i>
            </a>
            <a href="../sobre/index.html" class="menu-item" data-page="sobre">
                <div class="menu-item-icon"><i class="ri-information-line"></i></div>
                <span>Sobre</span>
                <i class="ri-arrow-right-s-line menu-item-arrow"></i>
            </a>
            <a href="../ajuda/index.html" class="menu-item" data-page="ajuda">
                <div class="menu-item-icon"><i class="ri-question-line"></i></div>
                <span>Como funciona</span>
                <i class="ri-arrow-right-s-line menu-item-arrow"></i>
            </a>
            <div class="contacto">
                <a href="https://wa.me/244929129797" title="WhatsApp"><i class="ri-whatsapp-line"></i></a>
                <a href="mailto:sebastiaompindi@gmail.com" title="Email"><i class="ri-mail-line"></i></a>
            </div>
        </div>
        <div class="menu-item tema-toggle-menu" id="themeBtn"
            style="background: none; border: solid 2px white; color: white;">
            <div class="menu-item-icon"><i class="ri-moon-line" id="themeIcon"></i></div>
            <span>Mudar Tema</span>
            <i class="ri-arrow-right-s-line menu-item-arrow"></i>
        </div>
        <div class="menu-footer">
            <small>© 2026 Mpindi TecMed</small>
            <small>Versão 1.0.0</small>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ================================================================== -->
    <section class="main-tool">

        <!-- ÁREA DE EDIÇÃO -->
        <div id="area-edicao" class="area-edicao">
            <div class="editor-wrapper">
                <div class="editor-header">
                    <div class="editor-header-left">
                        <span id="editor-status" class="editor-status">📝 Nova nota</span>
                        <span class="editor-shortcut"></span>
                    </div>
                    <span id="editor-data" class="editor-data"></span>
                </div>

                <div class="editor-titulo-wrapper">
                    <input type="text" id="editor-titulo" placeholder="Título da nota..." maxlength="60">
                    <i class="ri-pencil-line"></i>
                </div>

                <textarea id="editor-nota" placeholder="Escreva a sua nota clínica aqui..."></textarea>
            </div>
        </div>

        <!-- ÁREA DE LISTA -->
        <div id="area-lista" class="area-lista" style="display: none;">
            <div id="lista-notas" class="lista-notas"></div>
        </div>

        <!-- MENU FLUTUANTE -->
        <div class="menu-flutuante" id="menuFlutuante">
            <button id="btn-nova-nota" class="menu-btn active" title="Nova nota">
                <i class="ri-add-line"></i>
                <span>Nova</span>
            </button>

            <button id="btn-listar-notas" class="menu-btn" title="Ver todas as notas">
                <i class="ri-list-check-2"></i>
                <span>Lista</span>
                <span id="badge-contador" class="badge">0</span>
            </button>

            <button id="btn-salvar" class="menu-btn btn-salvar" title="Salvar nota" style="display: none;">
                <i class="ri-save-line"></i>
                <span>Salvar</span>
            </button>

            <button id="btn-limpar-todas" class="menu-btn danger" title="Limpar todas as notas">
                <i class="ri-delete-bin-line"></i>
                <span>Limpar</span>
            </button>
        </div>
    </section>

    <footer class="plain-footer">
        <div class="footer-inline">
            <span>&copy; 2026 Mpindi TecMed</span>
            <span class="footer-sep">|</span>
        </div>
    </footer>

    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/persistencia.js"></script>
    <script>AOS.init({ duration: 800 });</script>
    <script src="script.js"></script>
</body>

</html>
