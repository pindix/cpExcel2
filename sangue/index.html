        <style>
    /* Tema inline para evitar flash branco */
    :root {
        --bg-inline: #f0f2f0;
        --text-inline: #1a2a21;
    }
    
    [data-theme="dark"] {
        --bg-inline: black;
        --text-inline: #f0f2f0;
    }
    
    /* Aplica o fundo imediatamente */
    html {
        background-color: var(--bg-inline);
    }
    
    body {
        background-color: var(--bg-inline);
        color: var(--text-inline);
    }
    
    /* Força o fundo antes do JS carregar */
    body::before {
        display: none;
    }
</style>

<script>
    // Ler tema do localStorage ANTES do CSS carregar
    (function() {
        const tema = localStorage.getItem('tema');
        if (tema === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.body.setAttribute('data-theme', 'dark');
        }
    })();
</script>
